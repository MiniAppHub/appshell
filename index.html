<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<title>MiniAppHub</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/shell.css">
</head>
<body>
<header class="bar">
  <span class="brand">MiniAppHub</span>
  <span id="status" class="status"></span>
</header>

<main id="home" class="home">
  <section>
    <h2>Приложения</h2>
    <div id="launcher" class="grid"></div>
    <p id="empty" class="muted" hidden>Пока пусто. Установите приложение из каталога.</p>
  </section>
</main>

<section id="stage" class="stage" hidden>
  <nav class="stage-bar">
    <button id="back" class="icon-btn" aria-label="Назад">←</button>
    <span id="stage-title" class="stage-title"></span>
  </nav>
  <iframe id="frame" sandbox="allow-scripts allow-forms allow-downloads" title="mini-app"></iframe>
</section>

<div id="update" class="update" hidden>
  <span id="update-text">Доступна новая версия</span>
  <button id="update-btn" class="btn">Обновить</button>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
