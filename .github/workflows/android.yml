name: android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - name: Собрать www и добавить Android-проект
        run: |
          npm run build:www
          npx cap add android
          npx cap sync android
      - name: Версия из package.json
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Сборка debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Переименовать APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "MiniAppHub-${{ steps.ver.outputs.v }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: MiniAppHub-android
          path: MiniAppHub-*.apk
      - name: Релиз (только по тегу v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MiniAppHub-*.apk
          generate_release_notes: true
